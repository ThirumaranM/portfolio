<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width" />
		<script>
			(function () {
				try {
					const key = '@riadh-adrani-theme';
					const fromStore = localStorage.getItem(key);
					let isDark = false;
					if (fromStore === null) {
						isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					} else {
						isDark = JSON.parse(fromStore) === true;
					}
					const theme = isDark ? 'dark' : 'light';
					document.documentElement.setAttribute('data-theme', theme);

					// Apply background immediately — before any CSS loads — to kill the white flash
					document.documentElement.style.backgroundColor = isDark ? '#0a0d16' : '#f8fafc';
					document.documentElement.style.color = isDark ? '#f8fafc' : '#0f172a';

					// Add no-transitions class to block theme-change CSS transitions on first paint
					document.documentElement.classList.add('no-transitions');
					// Remove after first frame so subsequent theme toggles animate normally
					requestAnimationFrame(function () {
						requestAnimationFrame(function () {
							document.documentElement.classList.remove('no-transitions');
						});
					});
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
